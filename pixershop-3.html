<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pixershop | پیکسرشاپ</title>
<meta name="theme-color" content="#0b0b14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pixershop">
<script>try{if(JSON.parse(localStorage.getItem('ps_theme'))==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" media="print" onload="this.media='all'">
<style>
:root{--bg:#0b0b14;--bg2:#141427;--card:#1a1a33;--line:#2a2a4d;--txt:#ecebff;--mut:#9a98c4;--a:#8b5cf6;--b:#22d3ee;--ok:#34d399;--bad:#fb7185;--warn:#fbbf24;--hdr:rgba(11,11,20,.8)}
:root[data-theme=light]{--bg:#f4f4fb;--bg2:#ffffff;--card:#ffffff;--line:#dcdcee;--txt:#1b1b33;--mut:#66668a;--ok:#059669;--bad:#e11d48;--warn:#d97706;--hdr:rgba(244,244,251,.88)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Vazirmatn,system-ui,-apple-system,'Segoe UI',Tahoma,'Noto Sans Arabic',sans-serif;scroll-behavior:smooth}
body{padding-bottom:env(safe-area-inset-bottom)}
button,input,select,textarea{font-family:inherit;font-size:15px;color:var(--txt)}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--hdr);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.logo{font-weight:800;font-size:20px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.5px;user-select:none;-webkit-user-select:none}
.hb{display:flex;gap:6px}
.ib{position:relative;width:40px;height:40px;border-radius:13px;border:1px solid var(--line);background:var(--card);font-size:18px;cursor:pointer;padding:0;transition:transform .12s}
.ib[hidden]{display:none}
.ib .n{position:absolute;top:-5px;left:-5px;min-width:19px;height:19px;border-radius:10px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 4px}
.ib .n:empty{display:none}
.ib .n.bump{animation:bump .35s}
#hero{position:relative;height:min(78vh,560px);overflow:hidden;background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--a) 28%,var(--bg)) 0%,var(--bg) 70%)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:pan-y}
.hero-t{position:absolute;inset:auto 0 22px 0;text-align:center;padding:0 18px;pointer-events:none}
.hero-t h1{margin:0 0 6px;font-size:clamp(26px,7vw,46px);font-weight:800;text-shadow:0 0 30px var(--a)}
.hero-t p{margin:0 0 14px;color:var(--mut);font-size:14px}
.btn{display:inline-block;border:0;border-radius:14px;padding:12px 22px;font-weight:600;cursor:pointer;background:var(--a);color:#fff;box-shadow:0 8px 24px color-mix(in srgb,var(--a) 40%,transparent);pointer-events:auto;text-decoration:none;text-align:center;transition:transform .12s}
.btn.s{padding:8px 14px;font-size:13px;border-radius:11px;box-shadow:none}
.btn.g{background:var(--card);border:1px solid var(--line);box-shadow:none;color:var(--txt)}
.btn.r{background:var(--bad);box-shadow:none}
.btn.k{background:var(--ok);color:#052;box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.w{width:100%;display:block}
.btn:active,.ib:active,.chip:active,.tab:active{transform:scale(.95)}
.feat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:14px;max-width:900px;margin:auto}
.feat div{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 6px;text-align:center;font-size:12px;color:var(--mut)}
.feat b{display:block;font-size:20px;margin-bottom:3px}
section{max-width:1000px;margin:auto;padding:8px 14px 24px}
h2{font-size:20px;margin:18px 0 12px}
.rv{opacity:0;transform:translateY(18px);transition:opacity .7s ease,transform .7s ease}
.rv.show{opacity:1;transform:none}
.tools{display:flex;gap:8px;margin-bottom:10px}
.tools input{flex:2}.tools select{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px}
.chip{flex:none;border:1px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;font-size:13px;cursor:pointer;color:var(--mut);transition:transform .12s}
.chip.on{background:var(--a);color:#fff;border-color:var(--a)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;perspective:900px}
.pc{background:linear-gradient(160deg,var(--card),var(--bg2));border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform .15s ease,box-shadow .2s;transform-style:preserve-3d;will-change:transform}
.pc.in{animation:cardIn .55s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i,0)*55ms)}
.pc:hover{box-shadow:0 14px 40px color-mix(in srgb,var(--a) 25%,transparent)}
.pm{height:130px;display:grid;place-items:center;font-size:64px;background:radial-gradient(circle at 50% 40%,color-mix(in srgb,var(--a) 35%,transparent),transparent 70%);position:relative;cursor:pointer}
.pm img{width:100%;height:100%;object-fit:cover}
.bd{position:absolute;top:8px;right:8px;font-size:11px;padding:2px 8px;border-radius:10px;background:var(--bad);color:#fff}
.bd.w{background:var(--warn);color:#331}
.bd.o{top:auto;bottom:8px;background:var(--ok);color:#052}
.hrt,.cmp{position:absolute;left:8px;width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--bg) 70%,transparent);cursor:pointer;font-size:15px;line-height:1;padding:0;display:grid;place-items:center;font-family:inherit}
.hrt{top:8px}.cmp{top:46px}
.cmp.on{background:var(--a);border-color:var(--a)}
.hrt.big,.cmp.big{position:static;width:auto;height:auto;border-radius:12px;padding:8px 12px;font-size:13px;display:inline-block}
.pb{padding:10px 12px 12px}
.pb h3{margin:0 0 3px;font-size:15px;cursor:pointer}
.pb .c{font-size:11px;color:var(--mut)}
.pb .d{font-size:12px;color:var(--mut);margin:4px 0;min-height:16px}
.pr{font-weight:800;color:var(--b);margin:6px 0 8px;font-size:14px}
.pr s{color:var(--mut);font-weight:400;font-size:11px;margin-left:6px}
.cd{font-size:11px;color:var(--bad);font-weight:600;margin:-2px 0 8px}
.cd.big{font-size:14px;margin:4px 0 8px}
.empty{text-align:center;color:var(--mut);padding:30px 10px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:8px}
.mini{flex:none;width:118px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:8px;cursor:pointer;font-size:12px}
.mini .mm{height:70px;border-radius:10px;display:grid;place-items:center;font-size:34px;overflow:hidden;background:var(--card);margin-bottom:6px}
.mini .mm img{width:100%;height:100%;object-fit:cover}
.mini b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini span{color:var(--b);font-size:11px}
details{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
summary{cursor:pointer;font-weight:600;font-size:14px}
details p{margin:8px 0 0;color:var(--mut);font-size:13px;line-height:1.9;white-space:pre-line}
.about{color:var(--mut);font-size:14px;line-height:2;white-space:pre-line}
.contact{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px 14px 70px;border-top:1px solid var(--line)}
.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,5,12,.7);backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.panel{position:relative;width:100%;max-width:640px;max-height:92vh;overflow-y:auto;background:var(--bg2);border:1px solid var(--line);border-radius:22px 22px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));animation:up .25s ease}
.x{position:absolute;top:12px;left:12px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;z-index:2}
.panel h3.t{margin:2px 0 14px;font-size:18px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--a)}
textarea{min-height:70px;resize:vertical}
.row{display:flex;gap:8px;align-items:center}
.row>*{flex:1}
.it{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.it .ic{width:46px;height:46px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:24px;overflow:hidden;flex:none}
.it .ic img{width:100%;height:100%;object-fit:cover}
.it .in{flex:1;min-width:0}
.it .in b{display:block;font-size:14px}
.it .in span{font-size:12px;color:var(--mut)}
.q{display:flex;align-items:center;gap:6px}
.q button{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.sum{display:flex;justify-content:space-between;padding:4px 0;font-size:14px;color:var(--mut)}
.tot{display:flex;justify-content:space-between;font-weight:800;font-size:16px;padding:10px 0;color:var(--txt)}
.tabs{display:flex;gap:6px;margin:6px 0 12px;overflow-x:auto;padding-bottom:4px}
.tab{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:9px 12px;cursor:pointer;color:var(--mut);font-size:13px;transition:transform .12s}
.tab.on{background:var(--a);color:#fff;border-color:var(--a)}
.oc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px;font-size:13px}
.oc.warn{border-color:var(--warn)}
.oc .h{display:flex;justify-content:space-between;margin-bottom:6px}
.st{font-size:11px;padding:2px 9px;border-radius:10px;background:var(--a);color:#fff}
.st.confirmed{background:#2563eb}.st.shipped{background:#d97706}.st.delivered{background:var(--ok);color:#052}.st.canceled{background:var(--bad)}
.hint{font-size:12px;color:var(--mut);line-height:1.8}
.toast{position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:99;background:#fff;color:#111;padding:10px 18px;border-radius:14px;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.4);max-width:90vw;text-align:center}
.no3d #cv{display:none}
.gal{height:230px;border-radius:16px;overflow:hidden;background:var(--card);display:grid;place-items:center;font-size:96px;margin-bottom:8px;position:relative}
.gal img{width:100%;height:100%;object-fit:cover}
.gal canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab}
.gal .v3h{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:var(--mut);pointer-events:none}
.th{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.th button{flex:none;width:54px;height:54px;border-radius:10px;border:2px solid var(--line);padding:0;overflow:hidden;background:var(--card);cursor:pointer}
.th button.on{border-color:var(--a)}
.th img{width:100%;height:100%;object-fit:cover}
.big{font-size:20px;font-weight:800;color:var(--b);margin:8px 0}
.big s{font-size:13px;color:var(--mut);font-weight:400;margin-left:8px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.kpi b{display:block;font-size:16px;color:var(--b)}
.kpi span{font-size:11px;color:var(--mut)}
.bars{display:flex;gap:3px;height:140px;align-items:flex-end}
.bar{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:9px;color:var(--mut);gap:2px;min-width:0}
.bar i{display:block;width:100%;background:linear-gradient(var(--b),var(--a));border-radius:5px 5px 0 0;min-height:2px}
.bar em{font-style:normal;white-space:nowrap;min-height:11px}
.bar span{white-space:nowrap;min-height:12px;font-size:9px}
.hr{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:12px}
.hr>span{width:84px;flex:none}
.hr .tr{flex:1;height:8px;background:var(--bg2);border-radius:5px;overflow:hidden}
.hr .tr i{display:block;height:100%;background:linear-gradient(90deg,var(--a),var(--b))}
.hr>b{min-width:52px;text-align:left;font-size:11px}
.cmpg{display:grid;gap:8px}
.cmpc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px;font-size:12px;min-width:0}
.cmpc h4{margin:8px 0 4px;font-size:13px}
.cmpc .cl{color:var(--mut);font-size:10px;margin-top:6px}
.cmpc .cv{word-break:break-word}
#cbar{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);z-index:40;display:flex;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:8px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#cbar[hidden]{display:none}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;pointer-events:none;animation:spOut .5s .9s ease forwards}
#splash .sl{font-weight:800;font-size:34px;letter-spacing:2px;background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent;animation:pulse 1s ease-in-out infinite}
#pa{display:none}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes cardIn{from{opacity:0;transform:translateY(22px) scale(.94)}to{opacity:1;transform:none}}
@keyframes bump{40%{transform:scale(1.55)}}
@keyframes spOut{to{opacity:0;visibility:hidden}}
@keyframes pulse{50%{opacity:.45;transform:scale(.97)}}
@media(min-width:700px){.sheet{align-items:center}.panel{border-radius:22px}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}.rv{opacity:1;transform:none}}
@media print{
  html,body{background:#fff!important}
  body.printing>*{display:none!important}
  body.printing>#pa{display:block!important;color:#000;background:#fff;font-family:Tahoma,system-ui,sans-serif;font-size:13px}
  #pa .inv,#pa .lbl{page-break-after:always;padding:6px}
  #pa h2{margin:0 0 10px;font-size:18px}
  #pa .ir{display:flex;justify-content:space-between;margin:4px 0}
  #pa table{width:100%;border-collapse:collapse;margin:10px 0}
  #pa th,#pa td{border:1px solid #000;padding:5px 7px;text-align:right}
  #pa .tt{display:flex;justify-content:space-between;margin:3px 0}
  #pa .lbl{border:2px solid #000;width:14cm;font-size:16px;line-height:2}
  #pa .lbl .big2{font-size:20px;font-weight:700}
  #pa .lbl hr{border:0;border-top:1px dashed #000;margin:8px 0}
}
</style>
</head>
<body>
<div id="splash"><div class="sl" id="spn">PIXERSHOP</div></div>
<header>
  <div class="logo" id="logo">PIXERSHOP</div>
  <div class="hb">
    <button class="ib" data-act="install" id="instBtn" hidden title="نصب">⬇️</button>
    <button class="ib" data-act="theme" id="thBtn" title="حالت روشن/تیره">🌙</button>

  </div>
</header>

<div id="hero">
  <canvas id="cv"></canvas>
  <div class="hero-t">
    <h1 id="h1">دنیای گیمینگ ⚡</h1>
    <p id="hp"></p>
    <button class="btn" data-act="goshop">مشاهده محصولات</button>
  </div>
</div>

<div class="feat rv">
  <div><b>🛒</b>ثبت سفارش آسان</div>

</div>

<section id="shop">
  <h2>محصولات</h2>
  <div class="tools"><input id="q" placeholder="🔍 جستجو..."><select id="sort"><option value="new">جدیدترین</option><option value="cheap">ارزان‌ترین</option><option value="exp">گران‌ترین</option></select></div>
  <div class="chips" id="chips"></div>

</section>

<section id="recent" class="rv"></section>
<section id="about" class="rv"></section>
<section id="faq" class="rv"></section>

<footer>
  <div class="contact" id="contact"></div>
  <div>© <span id="fn">Pixershop</span> — همه حقوق محفوظ است</div>
</footer>

<div id="cbar" hidden><button class="btn s" data-act="cmpview">⚖️ مقایسه (<span id="cn2"></span>)</button><button class="btn s g" data-act="cmpclear">پاک کردن</button></div>
<div class="sheet" id="sheet" hidden><div class="panel"><button class="x" data-act="close">✕</button><div id="sc"></div></div></div>
<div id="pa"></div>

var hash=function(s){var x=5381;s=String(s);for(var i=0;i<s.length;i++)x=((x<<5)+x+s.charCodeAt(i))|0;return String(x)};
/*SHA-BEGIN*/
var K=[],H0=[];
(function(){var p=2,n=0;function isP(x){for(var i=2;i*i<=x;i++)if(x%i===0)return false;return true}
while(n<64){if(isP(p)){if(n<8)H0[n]=(Math.pow(p,.5)%1)*4294967296|0;K[n]=(Math.pow(p,1/3)%1)*4294967296|0;n++}p++}})();
function rot(x,n){return (x>>>n)|(x<<(32-n))}
function sha256(str){
  var b=unescape(encodeURIComponent(str)),l=b.length,w=[],i,j;
  for(i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i%4)*8);
  w[l>>2]|=0x80<<(24-(l%4)*8);
  w[(((l+8)>>6)<<4)+15]=l*8;
  var h=H0.slice(),W=new Array(64),a,bb,c,d,e,f,g,hh,t1,t2,S0,S1,ch,mj,s0,s1;
  for(j=0;j<w.length;j+=16){
    for(i=0;i<64;i++){
      if(i<16)W[i]=w[j+i]|0;
      else{s0=rot(W[i-15],7)^rot(W[i-15],18)^(W[i-15]>>>3);s1=rot(W[i-2],17)^rot(W[i-2],19)^(W[i-2]>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)|0}
    }
    a=h[0];bb=h[1];c=h[2];d=h[3];e=h[4];f=h[5];g=h[6];hh=h[7];
    for(i=0;i<64;i++){
      S1=rot(e,6)^rot(e,11)^rot(e,25);ch=(e&f)^(~e&g);t1=(hh+S1+ch+K[i]+W[i])|0;
      S0=rot(a,2)^rot(a,13)^rot(a,22);mj=(a&bb)^(a&c)^(bb&c);t2=(S0+mj)|0;
      hh=g;g=f;f=e;e=(d+t1)|0;d=c;c=bb;bb=a;a=(t1+t2)|0;
    }
    h[0]=(h[0]+a)|0;h[1]=(h[1]+bb)|0;h[2]=(h[2]+c)|0;h[3]=(h[3]+d)|0;h[4]=(h[4]+e)|0;h[5]=(h[5]+f)|0;h[6]=(h[6]+g)|0;h[7]=(h[7]+hh)|0;
  }
  return h.map(function(x){return ('00000000'+(x>>>0).toString(16)).slice(-8)}).join('');
}
/*SHA-END*/
function pwHash(pw,salt){var x=salt+pw,i;for(i=0;i<4000;i++)x=sha256(x+salt+pw);return x}
function makeAdmin(name,pw){
  var salt='';try{var u=new Uint8Array(12);crypto.getRandomValues(u);u.forEach(function(v){salt+=('0'+v.toString(16)).slice(-2)})}catch(e){salt=String(Math.random()).slice(2)+String(Date.now())}
  return {name:name,s:salt,h:pwHash(pw,salt)};
}

  Array.prototype.forEach.call(els,function(e){
    var t=+e.getAttribute('data-end')-now;if(t<=0){exp=true;return}
    var s=Math.floor(t/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),x=s%60;

  if(/پد\s*(ماوس|موس)|mouse\s*pad|mousepad/.test(t))return null;
  if(/ایرپاد|ایرباد|هندزفری|airpod|earbud|earphone/.test(t))return 'earbuds';
  if(/هدست|هدفون|headset|headphone/.test(t))return 'headset';
  if(/ماوس|موس|mouse/.test(t))return 'mouse';
  if(/کیبورد|صفحه.?کلید|keyboard/.test(t))return 'keyboard';
  return null;
}

  var vr=p.vars.length?'<label>انتخاب مدل / رنگ</label><div class="chips">'+p.vars.map(function(v){return '<button class="chip'+(v===sel.v?' on':'')+'" data-act="dvar" data-v="'+esc(v)+'">'+esc(v)+'</button>'}).join('')+'</div>':'';

function saveProduct(){
  var n=val('pn'),pr=parseInt(en(val('pp')),10),st=parseInt(en(val('ps')),10),op=parseInt(en(val('pop')),10)||0;
  if(!n)return toast('نام محصول را وارد کنید');
  if(isNaN(pr)||pr<0)return toast('قیمت معتبر نیست');
  if(isNaN(st)||st<0)return toast('موجودی معتبر نیست');
  var se=val('pse'),sale=0;if(se){sale=new Date(se).getTime();if(isNaN(sale))sale=0}
  var ps=P(),e=ps.filter(function(x){return x.id===editId})[0];
  var vars=val('pv').split(/[,،]/).map(function(x){return x.trim()}).filter(Boolean);
  var d={name:n,cat:val('pc'),icon:val('pi')||'🎮',price:pr,oldPrice:op,saleEnd:sale,stock:st,desc:val('pd'),vars:vars,model:val('pmd')||'auto',imgs:tmpImgs.slice()};
  if(e){for(var k in d)e[k]=d[k];delete e.img}
  else{d.id=Date.now();d.createdAt=d.id;ps.push(d)}
  DB.set('products',ps);touch();editId=null;tmpImgs=[];renderShop();toast('ذخیره شد ✓');adminView();
}

/* ====== خروجی اکسل، فاکتور و برچسب ====== */
function csvCell(v){v=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(v))v="'"+v;return '"'+v.replace(/"/g,'""')+'"'}
function exportCsv(){
  var list=orderList();if(!list.length)return toast('سفارشی برای خروجی نیست');
  var head=['کد سفارش','تاریخ','نام','موبایل','آدرس','محصولات','جمع کالاها','تخفیف','ارسال','مبلغ نهایی','روش پرداخت','وضعیت','توضیحات'];
  var rows=[head.map(csvCell).join(',')];
  list.forEach(function(o){
    var sub=o.sub!=null?o.sub:o.items.reduce(function(a,i){return a+i.price*i.qty},0);
    rows.push([csvCell(o.id),csvCell(o.date),csvCell(o.name),/^\d+$/.test(o.phone)?'="'+o.phone+'"':csvCell(o.phone),csvCell(o.addr),
      csvCell(o.items.map(function(i){return i.name+(i.v?' ('+i.v+')':'')+' x'+i.qty}).join(' | ')),sub,o.disc||0,o.ship||0,o.total,csvCell(o.pay==='card'?'کارت به کارت':'هماهنگی در پیام‌رسان'),csvCell(STATUS[o.status]),csvCell(o.note||'')].join(','));
  });
  download('pixershop-orders.csv','\uFEFF'+rows.join('\r\n'),'text/csv;charset=utf-8');
  toast('فایل اکسل دانلود شد ✓');
}
function printHtml(html){

}

    '<table><thead><tr><th>#</th><th>کالا</th><th>تعداد</th><th>قیمت واحد (تومان)</th><th>مبلغ (تومان)</th></tr></thead><tbody>'+
    o.items.map(function(it,i){return '<tr><td>'+fa(i+1)+'</td><td>'+esc(it.name)+(it.v?' ('+esc(it.v)+')':'')+'</td><td>'+fa(it.qty)+'</td><td>'+fa(it.price)+'</td><td>'+fa(it.price*it.qty)+'</td></tr>'}).join('')+'</tbody></table>'+
    '<div class="tt"><span>جمع کالاها</span><span>'+money(sub)+'</span></div>'+
    (o.disc?'<div class="tt"><span>تخفیف'+(o.code?' ('+esc(o.code)+')':'')+'</span><span>−'+money(o.disc)+'</span></div>':'')+

  function size(){var d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.max(2,Math.round(cv.clientWidth*d));cv.height=Math.max(2,Math.round(cv.clientHeight*d))}
  size();window.addEventListener('resize',size);
  function down(e){drag=true;lx=e.clientX;ly=e.clientY;try{cv.setPointerCapture(e.pointerId)}catch(x){}}
  function move(e){if(!drag)return;yaw+=(e.clientX-lx)*.012;pitch=Math.max(-1.3,Math.min(1.3,pitch+(e.clientY-ly)*.01));lx=e.clientX;ly=e.clientY}
  function up(){drag=false}
  function wheel(e){e.preventDefault();cam.z=Math.max(5,Math.min(14,cam.z+(e.deltaY>0?.5:-.5)))}
  cv.addEventListener('pointerdown',down);cv.addEventListener('pointermove',move);cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);cv.addEventListener('wheel',wheel,{passive:false});
  function frame(){if(!alive)return;raf=requestAnimationFrame(frame);if(!drag)yaw+=.011;piv.r[0]=pitch;piv.r[1]=yaw;C.render(root,cam,L)}
  frame();
  VW={stop:function(){alive=false;cancelAnimationFrame(raf);window.removeEventListener('resize',size);C.dispose()}};
  return true;
}

/* ====== صحنه سه‌بعدی صفحه اول ====== */
function init3d(){
  var hero=$('#hero'),cv=$('#cv'),C=MG.ctx(cv);
  if(!C){hero.classList.add('no3d');return}
  var th=THEMES[SET().theme]||THEMES.purple,T=MG.mats(th[0],th[1]),L=MG.lights(th[0],th[1]);
  var root=new MG.Node(),cam={x:0,y:.3,z:11,fov:45};
  function put(n){return root.add(n)}
  var hs=put(MG.model('headset',T)),ms=put(MG.model('mouse',T)),kb=put(MG.model('keyboard',T)),ap=put(MG.model('bud',T)),ap2=put(MG.model('bud',T)),logo=put(MG.model('logo',T));
  hs.p=[0,.3,0];ms.p=[-3.6,-1.2,.5];kb.p=[3.4,-1.5,.3];kb.r[0]=.5;ap.p=[3.1,1.9,-.5];ap.r[2]=-.4;ap2.p=[-3,2,-.8];ap2.r[2]=.4;logo.s=[1.25,1.25,1.25];
  var N_=260,pos=new Float32Array(N_*3),i;
  for(i=0;i<N_;i++){pos[i*3]=(Math.random()-.5)*22;pos[i*3+1]=(Math.random()-.5)*12;pos[i*3+2]=(Math.random()-.5)*10-2}
  var pn=put(new MG.Node());pn.pt={d:pos,size:.06,col:MG.hex(th[0]),op:.8};
  H3.apply=function(m){
    var all=!m||m==='all';
    ms.vis=kb.vis=ap.vis=ap2.vis=all;hs.vis=m!=='logo';logo.vis=m==='logo';
    var k=all?1.15:1.7;hs.s=[k,k,k];
  };
  H3.colors=function(a,b){T.setNeon(a,b);L.setColors(a,b);pn.pt.col=MG.hex(a)};
  function size(){
    var w=hero.clientWidth,h=hero.clientHeight;if(!w||!h)return;
    var d=Math.min(window.devicePixelRatio||1,2);cv.width=Math.round(w*d);cv.height=Math.round(h*d);
    var ar=w/h;cam.z=ar<.8?17:(ar<1.3?13:11);cam.y=ar<1.3?-.7:.3;
    var sx=ar<1.3?Math.max(.6,ar/1.3+.1):1;
    ms.p[0]=-3.6*sx;kb.p[0]=3.4*sx;ap.p[0]=3.1*sx;ap2.p[0]=-3*sx;
  }
  size();
  if(window.ResizeObserver)new ResizeObserver(size).observe(hero);else window.addEventListener('resize',size);
  var tx=0,ty=0;
  hero.addEventListener('pointermove',function(e){var r=hero.getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*1.2;ty=((e.clientY-r.top)/r.height-.5)*.6});
  var t0=performance.now();
  (function loop(){
    requestAnimationFrame(loop);
    if(document.hidden||!$('#sheet').hidden)return;
    var t=(performance.now()-t0)/1000;
    root.r[1]+=(tx-root.r[1])*.05;root.r[0]+=(ty-root.r[0])*.05;
    hs.r[1]=Math.sin(t*.6)*.6;hs.p[1]=.3+Math.sin(t*1.2)*.12;
    logo.r[1]=Math.sin(t*.7)*.9;logo.p[1]=Math.sin(t*1.2)*.15;
    ms.r[1]=t*.7;ms.p[1]=-1.2+Math.sin(t*1.1+1)*.1;
    kb.r[1]=Math.sin(t*.5)*.3;kb.p[1]=-1.5+Math.sin(t*1.0+2)*.1;
    ap.r[1]=t*.9;ap.p[1]=1.9+Math.sin(t*1.3)*.12;
    ap2.r[1]=-t*.9;ap2.p[1]=2.0+Math.sin(t*1.3+1.5)*.12;
    pn.r[1]=t*.02;
    C.render(root,cam,L);
  })();
}
